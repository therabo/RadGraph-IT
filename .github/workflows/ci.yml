name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint · type · test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU-only torch, no GPU)
        env:
          # CPU wheels only: CI has no GPU, and this keeps the install small and network-bounded.
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (type check)
        run: mypy

      - name: Pre-commit hooks
        if: matrix.python-version == '3.12'
        run: pre-commit run --all-files

      - name: Pytest (unit only — no network, no GPU, no weights)
        # Real-model integration runs once in the dedicated job below.
        run: pytest -m "not integration" --cov=radgraphit --cov-report=term-missing

  integration-real-model:
    name: pinned real-model integration (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache pinned Hugging Face artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-radgraphit-${{ hashFiles('src/radgraphit/artifacts/registry.py') }}

      - name: Install (CPU-only torch, no GPU)
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pinned checkpoint and golden-output tests
        env:
          RADGRAPHIT_RUN_HUB_INTEGRATION: "1"
          RADGRAPHIT_TEST_GOLDEN: tests/fixtures/real_checkpoint_golden.json
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest -m integration -ra

  build-install-smoke:
    name: build · twine · clean-install smoke import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Install wheel in a clean venv and smoke-import (no network at import)
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl
          # Importing must not touch the network, download a model, or import torch eagerly.
          /tmp/clean/bin/python - <<'PY'
          import sys
          import radgraphit
          from radgraphit import RadGraphIT
          assert "torch" not in sys.modules, "torch must not be imported at package import time"
          assert radgraphit.__version__
          print("smoke import OK:", radgraphit.__version__)
          PY
